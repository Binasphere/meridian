services:
  postgres:
    image: postgres:16-alpine
    container_name: venti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: venti
      POSTGRES_PASSWORD: venti
      POSTGRES_DB: venti
    ports:
      - "5433:5432"
    volumes:
      - venti-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venti -d venti"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  venti-pgdata:
